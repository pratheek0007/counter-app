name: Deploy CounterApp to AWS ECS

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read
id-token: write

env:
AWS_REGION: us-east-1
REPO_NAME: counterapp
CLUSTER_NAME: counterapp-cluster
SERVICE_NAME: counterapp-service
CONTAINER_NAME: counterapp

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ env.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Set image tag
    run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

  - name: Build and push Docker image
    run: |
      IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.REPO_NAME }}:${IMAGE_TAG}
      docker build -t $IMAGE_URI .
      docker push $IMAGE_URI
      echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

  - name: Render ECS task definition
    id: task-def
    uses: aws-actions/amazon-ecs-render-task-definition@v1
    with:
      task-definition: ecs-task-def.json
      container-name: ${{ env.CONTAINER_NAME }}
      image: ${{ env.IMAGE_URI }}

  - name: Deploy to ECS service
    uses: aws-actions/amazon-ecs-deploy-task-definition@v1
    with:
      task-definition: ${{ steps.task-def.outputs.task-definition }}
      service: ${{ env.SERVICE_NAME }}
      cluster: ${{ env.CLUSTER_NAME }}
      wait-for-service-stability: true

  - name: Force new deployment
    run: |
      aws ecs update-service \
        --cluster ${{ env.CLUSTER_NAME }} \
        --service ${{ env.SERVICE_NAME }} \
        --force-new-deployment
